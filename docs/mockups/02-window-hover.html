<!doctype html>
<html><head><meta charset="utf-8"><title>2 · Selecting: window hover</title>
<link rel="stylesheet" href="desktop.css">
</head>
<body>
<div class="stage" id="desktop"></div>
<div class="layer">
  <div class="win-outline" id="outline"></div>
  <div class="tag-label glass-dark" id="label">Safari <span class="soft num">1680 × 1000</span></div>
  <div class="hint glass-dark">Click a window, or drag to select an area <span class="soft">·</span> <span class="key">esc</span> <span class="soft">to cancel</span></div>
</div>
<script src="desktop.js"></script>
<script src="overlay.js"></script>
<script>
  const s = GEO.safari;
  place(document.getElementById('outline'), s);
  dim(s, 22);
  Object.assign(document.getElementById('label').style, { left: s.x + s.w / 2 + 'px', top: s.y + s.h / 2 + 'px' });
  cursor(CROSSHAIR, 930 - 11.5, 430 - 11.5);
</script>
</body></html>
