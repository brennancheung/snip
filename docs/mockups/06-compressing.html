<!doctype html>
<html><head><meta charset="utf-8"><title>6 · Compressing</title>
<link rel="stylesheet" href="desktop.css">
<style>
  .pill { padding: 0 16px; gap: 12px; }
  .progress { width: 120px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.18); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 62%; border-radius: 3px; background: #fff; }
</style>
</head>
<body>
<div class="stage" id="desktop"></div>
<div class="layer">
  <div class="bar pill glass-dark" id="pill"><span>Compressing…</span><span class="progress"><i></i></span></div>
</div>
<script src="desktop.js"></script>
<script src="overlay.js"></script>
<script>
  const a = GEO.area;
  Object.assign(document.getElementById('pill').style, { left: a.x + a.w / 2 + 'px', top: a.y + a.h + 12 + 'px' });
  cursor(ARROW, 930, 292);
</script>
</body></html>
