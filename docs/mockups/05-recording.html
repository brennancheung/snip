<!doctype html>
<html><head><meta charset="utf-8"><title>5 · Recording</title>
<meta name="mockup-closeup" content="350,0,900,675">
<link rel="stylesheet" href="desktop.css">
<style>
  .rec-border { position: absolute; box-shadow: 0 0 0 2px var(--record), 0 0 10px rgba(255, 59, 48, 0.45); border-radius: 1px; }
  .pill { padding: 0 5px 0 14px; gap: 10px; }
  .pill .live { display: flex; align-items: center; gap: 7px; font-weight: 600; margin-right: 2px; }
  .pill .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--record); box-shadow: 0 0 6px rgba(255, 59, 48, 0.8); display: block; }
  .pill .stop i { width: 9px; height: 9px; border-radius: 2px; background: #fff; display: block; }
</style>
</head>
<body data-snip="recording">
<div class="stage" id="desktop"></div>
<div class="layer">
  <div class="rec-border" id="border"></div>
  <div class="bar pill glass-dark" id="pill">
    <span class="live num"><i></i>0:12</span>
    <span class="btn ghost stop"><i></i>Stop</span>
    <span class="icon-btn" title="Discard"><svg width="14" height="15" viewBox="0 0 14 15" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3.5h12M5 3.5V2c0-.6.4-1 1-1h2c.6 0 1 .4 1 1v1.5M2.5 3.5l.7 9.6c0 .5.5.9 1 .9h5.6c.5 0 1-.4 1-.9l.7-9.6M5.6 6.5v4.5M8.4 6.5v4.5"/></svg></span>
  </div>
</div>
<script src="desktop.js"></script>
<script src="overlay.js"></script>
<script>
  const a = GEO.area;
  place(document.getElementById('border'), a);
  Object.assign(document.getElementById('pill').style, { left: a.x + a.w / 2 + 'px', top: a.y + a.h + 12 + 'px' });
  cursor(ARROW, 930, 292);
</script>
</body></html>
